<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missão Português · Mundo dos Blocos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dff1ff; --panel:#ffffff; --ink:#1d2433; --muted:#5b6475; --line:#b9c3d3;
  --grass:#3baa5c; --dirt:#8b5a2b; --slot:#ffffff; --ok:#2fa84f; --bad:#e2453c;
  --blue:#2b8fe0; --red:#d9283c; --orange:#f5781a; --green:#1f8a4c;
  --pink:#c64fd0; --indigo:#4f5fe0; --teal:#2fb884; --flame:#e8430f;
  --purple:#8a3ee8; --yellow:#f2b705; --hover:#fff4c7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131a26; --panel:#1d2635; --ink:#eef2f8; --muted:#a4afc2; --line:#3c4a61;
    --slot:#243044; --hover:#3d3a22;
  }
}
:root[data-theme="dark"]{
  --bg:#131a26; --panel:#1d2635; --ink:#eef2f8; --muted:#a4afc2; --line:#3c4a61;
  --slot:#243044; --hover:#3d3a22;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
}
button{font-family:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--yellow); outline-offset:3px}
.ground{height:26px; flex-shrink:0; margin-top:auto;
  background:
    linear-gradient(var(--grass) 0 10px, transparent 10px),
    repeating-linear-gradient(90deg,#7a4e25 0 18px,var(--dirt) 18px 36px);
}
header.top{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 16px; max-width:1180px; width:100%; margin:0 auto;
}
.timer{font-size:1.5rem; font-weight:500; min-width:70px}
.starcount{display:flex; align-items:center; gap:6px; font-weight:600; font-size:1.5rem;
  background:var(--panel); border:2px solid var(--line); border-radius:999px; padding:2px 16px 2px 8px}
.starcount .ic{font-size:1.6rem; display:inline-block}
.starcount.bump .ic{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.6) rotate(15deg)}}
.iconbtn{background:var(--panel);border:2px solid var(--line);border-radius:10px;
  color:var(--ink);font-size:1.2rem;width:44px;height:44px;cursor:pointer}
main{max-width:1180px; width:100%; margin:0 auto; padding:4px 16px 24px; flex:1}
h1.title{font-size:clamp(2rem,5vw,3.4rem);font-weight:600;text-align:center;margin:8px 0 4px;line-height:1.1}
p.lead{text-align:center;color:var(--muted);font-size:1.15rem;margin:0 0 22px}
h2.q{font-size:clamp(1.6rem,4.4vw,3rem);font-weight:500;text-align:center;margin:10px auto 18px;line-height:1.15;max-width:900px}
h2.q.small{font-size:clamp(1.25rem,3vw,1.9rem)}

/* bloco estilo jogo */
.blk{
  --c:var(--blue);
  position:relative; border:none; cursor:grab; color:#fff; font-weight:500;
  background:var(--c); border-radius:8px; padding:14px 16px;
  box-shadow: inset 0 0 0 5px rgba(255,255,255,.14), inset 0 -8px 0 rgba(0,0,0,.18), 0 3px 0 rgba(0,0,0,.22);
  text-shadow:0 1px 0 rgba(0,0,0,.15);
  transition:transform .08s, filter .15s, opacity .15s;
  line-height:1.15; user-select:none; -webkit-user-select:none; touch-action:none;
}
.blk::after{content:"";position:absolute;inset:10px 10px auto 10px;height:30%;
  background:rgba(255,255,255,.08);border-radius:3px;pointer-events:none}
.blk:hover{filter:brightness(1.07)}
.blk.sel{outline:5px solid var(--yellow); outline-offset:2px; transform:translateY(-3px)}
.blk.lifted{opacity:.3}
.blk.locked{cursor:default}
.world{cursor:pointer}
.ghost{position:fixed;z-index:1000;pointer-events:none;transform:rotate(-4deg) scale(1.06);
  box-shadow:0 14px 24px rgba(0,0,0,.3), inset 0 0 0 5px rgba(255,255,255,.14), inset 0 -8px 0 rgba(0,0,0,.18);margin:0}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

/* mapa */
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.world{min-height:160px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;padding:18px;gap:6px}
.world .n{font-size:1.05rem;opacity:.92}
.world .t{font-size:1.4rem;font-weight:600}
.world .d{font-size:.98rem;opacity:.95}
.world .done{position:absolute;top:10px;right:12px;font-size:1.3rem}

/* mundo 1: encaixar */
.tray{border:2px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;min-height:84px;margin-bottom:22px}
.tray .blk{font-size:clamp(1.1rem,2.8vw,2.1rem);min-height:66px}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 22px}
.target{display:flex;flex-direction:column;align-items:center;gap:6px}
.slot{width:100%;height:74px;border:2px solid var(--line);background:var(--slot);border-radius:3px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:5px;transition:background .15s}
.slot.ready{border-style:dashed;border-color:var(--yellow)}
.hover{background:var(--hover)!important;border-color:var(--yellow)!important;border-style:solid!important}
.slot .blk{width:100%;height:100%;font-size:clamp(1rem,2.2vw,1.6rem);padding:4px}
.slot.ok{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok)}
.label{font-size:clamp(1.2rem,3vw,2.4rem);text-align:center}
.tip{color:var(--muted);text-align:center;margin:-8px 0 14px;font-size:1.05rem}

/* mundo 1: ligar com linha */
.lines{position:relative;display:grid;grid-template-columns:minmax(120px,300px) minmax(50px,1fr) minmax(140px,340px);
  gap:12px 0;justify-content:center;align-items:center;max-width:980px;margin:0 auto}
.lines svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.lcell{grid-column:1;display:flex;align-items:center;gap:10px}
.rcell{grid-column:3;display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--slot);
  border-radius:6px;padding:8px 12px;min-height:62px;cursor:pointer;font-size:clamp(1.2rem,2.6vw,1.9rem)}
.lcell .blk{flex:1;font-size:clamp(1.2rem,2.6vw,1.9rem);padding:10px}
.dot{width:22px;height:22px;border-radius:50%;background:var(--panel);border:4px solid var(--ink);flex-shrink:0}
.lcell.done .blk{filter:saturate(.7)}
.lcell.done .dot,.rcell.done .dot{background:var(--ok);border-color:var(--ok)}
.rcell.done{border-color:var(--ok)}

/* quiz */
.quizwrap{display:grid;grid-template-columns:minmax(240px,390px) 1fr;gap:22px;align-items:center}
.quizwrap.nopoem{grid-template-columns:1fr}
.poem{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:14px 16px;font-size:1.02rem;line-height:1.4}
.poem b{display:block;font-size:1.2rem;margin-bottom:8px}
.poem .est{margin:0 0 12px;padding-left:8px;border-left:4px solid var(--line)}
.poem .est:last-child{margin-bottom:0}
.dropans{border:3px dashed var(--line);background:var(--slot);border-radius:8px;min-height:90px;
  display:flex;align-items:center;justify-content:center;font-size:clamp(1.3rem,3vw,2.2rem);
  color:var(--muted);margin:0 auto 16px;max-width:560px;text-align:center;padding:8px;transition:background .15s}
.dropans.ok{border:3px solid var(--ok);color:var(--ok);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.opts .blk{flex:1 1 240px;max-width:400px;min-height:100px;font-size:clamp(1.3rem,3.2vw,2.3rem)}
.opts .blk.right{background:var(--ok)!important;outline:5px solid var(--ok);opacity:1}
.opts .blk.wrong{background:var(--bad)!important}
.opts .blk.dim{opacity:.35}

/* classificar */
.sortwrap{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:22px;align-items:start}
.sortwrap.stack{grid-template-columns:1fr}
.pool{border:2px solid var(--line);border-radius:6px;background:var(--panel);padding:8px;
  display:grid;grid-template-columns:repeat(2,1fr);gap:6px;min-height:80px}
.stack .pool{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pool .blk,.gslots .blk{font-size:.98rem;padding:8px 6px;min-height:60px;width:100%}
.stack .pool .blk,.stack .gslots .blk{font-size:clamp(1.2rem,2.6vw,1.7rem);min-height:64px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 18px}
.group h3{font-size:1.7rem;font-weight:500;text-align:center;margin:0 0 6px}
.group h3 small{display:block;font-size:.95rem;color:var(--muted);font-weight:400}
.gslots{display:grid;grid-template-columns:1fr;gap:6px;border:2px solid var(--line);background:var(--slot);
  min-height:80px;padding:6px;border-radius:4px;cursor:pointer;transition:background .15s}
.stack .gslots{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));min-height:150px;align-content:start}
.gslots.ready{border-style:dashed;border-color:var(--yellow)}
.gslots .blk.locked{outline:3px solid var(--ok)}

/* explicação das conjunções */
.explain{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:6px 0 18px}
.ecard{background:var(--panel);border:2px solid var(--line);border-radius:8px;overflow:hidden}
.ecard .eh{color:#fff;padding:10px 14px;font-size:1.45rem;font-weight:600;background:var(--c)}
.ecard .eh span{display:block;font-size:.95rem;font-weight:400}
.ecard .words{padding:10px 14px 4px;font-size:1.1rem}
.ecard ol{margin:6px 0 12px;padding-left:34px;font-size:1.05rem;line-height:1.5}
.ecard b.cj{color:var(--c);font-weight:700}

/* barra inferior */
.bar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.btn{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;
  font-size:1.35rem;padding:8px 26px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.go{background:var(--green);color:#fff;border-color:transparent}
.count{font-size:1.5rem}
.msg{text-align:center;font-size:1.4rem;min-height:1.8em;margin-top:12px;font-weight:500}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.progress{height:14px;background:var(--panel);border:2px solid var(--line);border-radius:999px;overflow:hidden;max-width:520px;margin:0 auto 14px}
.progress i{display:block;height:100%;background:var(--yellow);width:0;transition:width .3s}

/* final */
.end{text-align:center;padding:20px}
.end .big{font-size:clamp(2.4rem,8vw,5rem);font-weight:700;margin:0;line-height:1.1}
.stars{font-size:4rem;letter-spacing:6px;color:#f2b705;margin:0}
.stars span{display:inline-block;animation:pop .5s backwards}

/* efeitos */
#fx{position:fixed;inset:0;pointer-events:none;z-index:2000}
.flystar{position:fixed;z-index:2100;font-size:2.6rem;pointer-events:none;
  transition:transform .75s cubic-bezier(.5,-0.3,.7,1), opacity .75s}

@media (max-width:760px){
  .tray,.targets{grid-template-columns:repeat(2,1fr)}
  .quizwrap,.sortwrap{grid-template-columns:1fr}
  .lines{grid-template-columns:1fr 36px 1.15fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="timer" id="timer"></div>
  <div class="starcount" id="starBox"><span class="ic">⭐</span><span id="starCount">0</span></div>
  <div style="display:flex;gap:8px">
    <button class="iconbtn" id="fsBtn" aria-label="Tela cheia" title="Tela cheia">⛶</button>
    <button class="iconbtn" id="soundBtn" aria-label="Ligar ou desligar som">🔊</button>
    <button class="iconbtn" id="homeBtn" aria-label="Voltar ao mapa">☰</button>
  </div>
</header>
<main id="app"></main>
<div class="ground"></div>
<canvas id="fx"></canvas>

<script>
/* ============ utilidades ============ */
const COLORS=["--blue","--red","--orange","--green","--pink","--indigo","--teal","--flame","--purple"];
const col=i=>`var(${COLORS[i%COLORS.length]})`;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);
const app=$("#app");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
function h(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const[k,v] of Object.entries(attrs)){
    if(k==="style"&&typeof v==="object") Object.assign(e.style,v);
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(k==="html") e.innerHTML=v;
    else e.setAttribute(k,v);
  }
  for(const c of kids.flat(3)) if(c!=null&&c!==false) e.append(c.nodeType?c:document.createTextNode(c));
  return e;
}
function blk(text,color,extra={}){const b=h("button",{class:"blk",...extra},text);b.style.setProperty("--c",color);return b}
function redo(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function center(el){const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}

/* armazenamento */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let stars=store.get("stars",0);
let done=store.get("done",{});
$("#starCount").textContent=stars;

/* som */
let soundOn=store.get("sound",true), actx=null;
function beep(type){
  if(!soundOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=type==="ok"?[660,880,1175]:type==="bad"?[220,180]:type==="win"?[523,659,784,1046,1318]:type==="grab"?[520]:[440];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type==="bad"?"sawtooth":"square";o.frequency.value=f;
      const t=actx.currentTime+i*.09;
      g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.18);
    });
  }catch(e){}
}
const soundBtn=$("#soundBtn");
const paintSound=()=>soundBtn.textContent=soundOn?"🔊":"🔇";
paintSound();
soundBtn.onclick=()=>{soundOn=!soundOn;store.set("sound",soundOn);paintSound()};
$("#homeBtn").onclick=()=>showMap();

/* tela cheia */
const fsBtn=$("#fsBtn");
const paintFs=()=>{const on=!!document.fullscreenElement;fsBtn.textContent=on?"🗗":"⛶";
  fsBtn.title=on?"Sair da tela cheia":"Tela cheia";fsBtn.setAttribute("aria-label",fsBtn.title)};
fsBtn.onclick=()=>{
  try{
    if(document.fullscreenElement) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else{const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}
  }catch(e){}
};
document.addEventListener("fullscreenchange",()=>{paintFs();sizeCanvas()});
document.addEventListener("webkitfullscreenchange",()=>{paintFs();sizeCanvas()});
addEventListener("keydown",e=>{if(e.key==="F11"){e.preventDefault();fsBtn.click()}});
paintFs();

/* cronômetro (conta para cima, sem pressão) */
let tStart=0,tInt=null;
function startTimer(){stopTimer();tStart=Date.now();tick();tInt=setInterval(tick,1000)}
function stopTimer(){clearInterval(tInt);$("#timer").textContent=""}
function tick(){const s=Math.floor((Date.now()-tStart)/1000);$("#timer").textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}

/* ============ confete e estrelas ============ */
const cv=$("#fx"),cx=cv.getContext("2d");
let parts=[],raf=null;
function sizeCanvas(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
sizeCanvas();addEventListener("resize",sizeCanvas);
const FXC=["#2b8fe0","#d9283c","#f5781a","#3baa5c","#c64fd0","#f2b705","#2fb884","#8a3ee8"];
function confetti(x,y,n=40,spread=1){
  if(reduced)return;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=(3+Math.random()*7)*spread;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:FXC[i%FXC.length],life:70+Math.random()*50});
  }
  if(!raf)raf=requestAnimationFrame(step);
}
function bigConfetti(){
  if(reduced)return;
  for(let k=0;k<6;k++) setTimeout(()=>confetti(innerWidth*(.1+.16*k),innerHeight*.25,55,1.3),k*120);
}
function step(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/25);
    cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s);   // confete quadrado, estilo bloco
    cx.fillStyle="rgba(0,0,0,.18)";cx.fillRect(-p.s/2,p.s/4,p.s,p.s/4);
    cx.restore();
  }
  raf=parts.length?requestAnimationFrame(step):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}
function winStar(fromEl){
  const [x,y]=fromEl?center(fromEl):[innerWidth/2,innerHeight/2];
  confetti(x,y,45);
  beep("ok");
  const box=$("#starBox");
  const finish=()=>{stars++;store.set("stars",stars);$("#starCount").textContent=stars;redo(box,"bump")};
  if(reduced){finish();return}
  const s=h("span",{class:"flystar"},"⭐");
  s.style.left=(x-20)+"px";s.style.top=(y-20)+"px";
  document.body.append(s);
  const [tx,ty]=center(box.querySelector(".ic"));
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    s.style.transform=`translate(${tx-x}px,${ty-y}px) scale(.6) rotate(360deg)`;
  }));
  setTimeout(()=>{s.remove();finish()},780);
}

/* ============ arrastar (mouse e toque) ============ */
function draggable(el,{onDrop,onTap,onStart}){
  el.addEventListener("pointerdown",e=>{
    if(el.classList.contains("locked")||e.button>0)return;
    e.preventDefault();
    const sx=e.clientX,sy=e.clientY,r=el.getBoundingClientRect(),ox=sx-r.left,oy=sy-r.top;
    let ghost=null,over=null;
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    const move=ev=>{
      if(!ghost){
        if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<7)return;
        ghost=el.cloneNode(true);ghost.classList.add("ghost");ghost.classList.remove("sel");
        ghost.style.width=r.width+"px";ghost.style.height=r.height+"px";
        document.body.append(ghost);el.classList.add("lifted");onStart&&onStart();beep("grab");
      }
      ghost.style.left=(ev.clientX-ox)+"px";ghost.style.top=(ev.clientY-oy)+"px";
      const t=document.elementFromPoint(ev.clientX,ev.clientY);
      const d=t&&t.closest("[data-drop]");
      if(d!==over){over&&over.classList.remove("hover");over=d;d&&d.classList.add("hover")}
    };
    const up=ev=>{
      el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);
      over&&over.classList.remove("hover");
      if(ghost){ghost.remove();el.classList.remove("lifted");if(over&&ev.type==="pointerup")onDrop(over)}
      else if(ev.type==="pointerup")onTap&&onTap();
    };
    el.addEventListener("pointermove",move);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  });
  // teclado (Enter/Espaço)
  el.addEventListener("click",e=>{if(e.detail===0&&onTap)onTap()});
}
function dropZone(el,onActivate){
  el.setAttribute("data-drop","");
  el.setAttribute("tabindex","0");el.setAttribute("role","button");
  el.addEventListener("click",onActivate);
  el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onActivate(e)}});
}

/* ============ conteúdo ============ */
const POEMS={
  blocos:{t:"No Mundo dos Blocos",e:[
    ["No mundo feito de blocos,","eu pulo de lá pra cá.","Construo casa e castelo,","ninguém vai me segurar!"],
    ["Tem lava, tem armadilha,","tem ponte pra atravessar.","Se eu cair, eu não desisto:","no checkpoint vou voltar!"],

function progressBar(){const i=h("i");return{el:h("div",{class:"progress"},i),set:(a,b)=>i.style.width=(100*a/b)+"%"}}

/* ============ mundo 1 · rodada 1: arrastar para a caixa ============ */
function playMatch(){
  startTimer();
  const tally={right:0,total:0};
  const pairs=MATCH_ROUNDS[0];
  const order=shuffle(pairs.map((_,i)=>i));
  const targets=shuffle(pairs.map((_,i)=>i));
  const colorOf={};order.forEach((pi,k)=>colorOf[pi]=col(k));
  const placed=new Set(), missed=new Set();
  let sel=null;
  const tray=h("div",{class:"tray"});
  const grid=h("div",{class:"targets"});
  const msg=h("div",{class:"msg"});
  const pb=progressBar();
  const next=h("button",{class:"btn go",style:{display:"none"}},"Próxima rodada: ligar com linha");
  const slotEls={};

  function renderTray(){
    tray.replaceChildren();
    order.forEach(pi=>{
      if(placed.has(pi))return;
      const b=blk(pairs[pi][0],colorOf[pi]);
      if(sel===pi)b.classList.add("sel");
      draggable(b,{
        onStart:()=>{sel=null;paintReady()},
        onTap:()=>{sel=sel===pi?null:pi;beep("tap");renderTray();paintReady()},
        onDrop:z=>attempt(pi,+z.dataset.t)
      });
      tray.append(b);
    });
    if(!tray.children.length) tray.append(h("span",{style:{gridColumn:"1/-1",alignSelf:"center",textAlign:"center",color:"var(--ok)",fontSize:"1.3rem"}},"Rodada completa! 🎉"));
  }
  function paintReady(){Object.entries(slotEls).forEach(([ti,s])=>s.classList.toggle("ready",sel!=null&&!placed.has(+ti)))}
  function attempt(pi,ti){
    const slot=slotEls[ti];
    if(placed.has(ti))return;
    sel=null;
    if(pi===ti){
      placed.add(pi);
      const b=blk(pairs[pi][0],colorOf[pi],{tabindex:"-1"});b.classList.add("locked","pop");
      slot.replaceChildren(b);slot.classList.add("ok");slot.classList.remove("ready");
      slot.removeAttribute("data-drop");
      if(!missed.has(pi))tally.right++;
      winStar(slot);
      msg.className="msg ok";msg.textContent=["Isso aí!","Muito bem!","Acertou!","Mandou bem!"][placed.size%4];
      pb.set(placed.size,pairs.length);
      if(placed.size===pairs.length){beep("win");bigConfetti();next.style.display=""}
    }else{
      missed.add(pi);beep("bad");redo(slot,"shake");
      msg.className="msg bad";msg.textContent=`“${pairs[pi][0]}” não combina com “${pairs[ti][1]}”. Tente outra caixa!`;
    }
    renderTray();paintReady();
  }
  targets.forEach(ti=>{
    const slot=h("div",{class:"slot","data-t":ti,"aria-label":`Caixa de ${pairs[ti][1]}`});
    dropZone(slot,()=>{if(sel!=null)attempt(sel,ti)});
    slotEls[ti]=slot;
    grid.append(h("div",{class:"target"},slot,h("div",{class:"label"},pairs[ti][1])));
  });
  next.onclick=()=>{tally.total=pairs.length;playLines(tally)};
  app.replaceChildren(
    h("h2",{class:"q small"},"Arraste cada palavra primitiva para a palavra que nasceu dela"),
    h("p",{class:"tip"},"Rodada 1 de 2 · Você também pode tocar no bloco e depois na caixa"),
    pb.el,tray,grid,msg,h("div",{class:"bar"},next)
  );
  renderTray();
}

/* ============ mundo 1 · rodada 2: ligar com linha ============ */
function playLines(tally){
  const pairs=MATCH_ROUNDS[1];
  const left=shuffle(pairs.map((_,i)=>i)), right=shuffle(pairs.map((_,i)=>i));
  const NS="http://www.w3.org/2000/svg";
  const wrap=h("div",{class:"lines"});
  const svg=document.createElementNS(NS,"svg");
  const L={},R={};
  const matched=new Set(), missed=new Set();
  let sel=null, temp=null, flash=null;
  const msg=h("div",{class:"msg"});
  const pb=progressBar();
  const fin=h("button",{class:"btn go",style:{display:"none"}},"Terminar mundo");

  const pos=(el,side)=>{const d=el.querySelector(".dot").getBoundingClientRect(),w=wrap.getBoundingClientRect();return[d.left+d.width/2-w.left,d.top+d.height/2-w.top]};
  function line(a,b,color,dash){
    const l=document.createElementNS(NS,"line");
    l.setAttribute("x1",a[0]);l.setAttribute("y1",a[1]);l.setAttribute("x2",b[0]);l.setAttribute("y2",b[1]);
    l.setAttribute("stroke",color);l.setAttribute("stroke-width","6");l.setAttribute("stroke-linecap","round");
    if(dash)l.setAttribute("stroke-dasharray","10 8");
    svg.append(l);
  }
  function draw(){
    if(!wrap.isConnected)return;
    svg.replaceChildren();
    matched.forEach(i=>line(pos(L[i]),pos(R[i]),"var(--ok)"));
    if(flash)line(pos(L[flash[0]]),pos(R[flash[1]]),"var(--bad)");
    if(temp)line(pos(L[temp.from]),temp.to,"var(--yellow)",true);
  }
  addEventListener("resize",draw);
  function paintSel(){left.forEach(i=>L[i].querySelector(".blk").classList.toggle("sel",sel===i))}
  function attempt(li,ri){
    if(matched.has(li)||matched.has(ri))return;
    sel=null;paintSel();
    if(li===ri){
      matched.add(li);L[li].classList.add("done");R[ri].classList.add("done");
      L[li].querySelector(".blk").classList.add("locked");
      if(!missed.has(li))tally.right++;
      winStar(R[ri]);draw();
      msg.className="msg ok";msg.textContent=`${pairs[li][0]} → ${pairs[ri][1]}. Acertou!`;
      pb.set(matched.size,pairs.length);
      if(matched.size===pairs.length){beep("win");bigConfetti();fin.style.display=""}
    }else{
      missed.add(li);beep("bad");redo(R[ri],"shake");
      flash=[li,ri];draw();setTimeout(()=>{flash=null;draw()},650);
      msg.className="msg bad";msg.textContent=`“${pairs[li][0]}” não vira “${pairs[ri][1]}”. Tente de novo!`;
    }
  }
  left.forEach((li,k)=>{
    const b=blk(pairs[li][0],col(k));
    const cell=h("div",{class:"lcell",style:{gridRow:k+1}},b,h("span",{class:"dot"}));
    L[li]=cell;
    b.addEventListener("pointerdown",e=>{
      if(matched.has(li)||e.button>0)return;
      e.preventDefault();
      const sx=e.clientX,sy=e.clientY;let moved=false,over=null;
      try{b.setPointerCapture(e.pointerId)}catch(_){}
      const move=ev=>{
        if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<7)return;
        if(!moved){moved=true;beep("grab");sel=null;paintSel()}
        const w=wrap.getBoundingClientRect();
        temp={from:li,to:[ev.clientX-w.left,ev.clientY-w.top]};
        const t=document.elementFromPoint(ev.clientX,ev.clientY);
        const d=t&&t.closest(".rcell");
        if(d!==over){over&&over.classList.remove("hover");over=d;d&&d.classList.add("hover")}
        draw();
      };
      const up=ev=>{
        b.removeEventListener("pointermove",move);b.removeEventListener("pointerup",up);b.removeEventListener("pointercancel",up);
        over&&over.classList.remove("hover");temp=null;draw();
        if(moved){if(over&&ev.type==="pointerup")attempt(li,+over.dataset.r)}
        else if(ev.type==="pointerup"){sel=sel===li?null:li;beep("tap");paintSel()}
      };
      b.addEventListener("pointermove",move);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);
    });
    b.addEventListener("click",e=>{if(e.detail===0&&!matched.has(li)){sel=sel===li?null:li;paintSel()}});
    wrap.append(cell);
  });
  right.forEach((ri,k)=>{
    const cell=h("div",{class:"rcell","data-r":ri,style:{gridRow:k+1},tabindex:"0",role:"button"},h("span",{class:"dot"}),pairs[ri][1]);
    const act=()=>{if(sel!=null)attempt(sel,ri)};
    cell.addEventListener("click",act);
    cell.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act()}});
    R[ri]=cell;wrap.append(cell);
  });
  wrap.append(svg);
  fin.onclick=()=>{tally.total+=pairs.length;removeEventListener("resize",draw);finish("ligar","Mundo 1 completo!",{score:tally.right,total:tally.total})};
  app.replaceChildren(
    h("h2",{class:"q small"},"Ligue a palavra primitiva à sua derivada"),
    h("p",{class:"tip"},"Rodada 2 de 2 · Arraste do bloco até a palavra para puxar a linha"),
    pb.el,wrap,msg,h("div",{class:"bar"},fin)
  );
  requestAnimationFrame(draw);
}

/* ============ mundos 4 e final: quiz com arrastar ============ */
function poemCard(key){
  const p=POEMS[key];
  return h("div",{class:"poem"},h("b",{},p.t),p.e.map(est=>h("p",{class:"est"},est.flatMap((v,i)=>i<est.length-1?[v,h("br")]:[v]))));
}
function playQuiz(id,title,qs){
  startTimer();
  let idx=0,score=0;
  function show(){
    const q=qs[idx];
    const order=shuffle(q.opts.map((_,i)=>i));
    const msg=h("div",{class:"msg"});
    const pb=progressBar();pb.set(idx,qs.length);
    const next=h("button",{class:"btn go",disabled:""},idx<qs.length-1?"Próxima ▷":"Ver resultado ▷");
    const drop=h("div",{class:"dropans"},"Arraste a resposta aqui");
    let solved=false,missed=false;
    const answer=(oi,b)=>{
      if(solved)return;
      if(oi===q.a){
        solved=true;if(!missed)score++;
        b.classList.add("right");
        [...opts.children].forEach(x=>{x.classList.add("locked");if(x!==b)x.classList.add("dim")});
        drop.textContent=q.opts[oi];drop.classList.add("ok");redo(drop,"pop");drop.removeAttribute("data-drop");
        winStar(drop);
        msg.className="msg ok";msg.textContent=missed?"Agora sim! +1 estrela":"Acertou de primeira! +1 estrela";
        next.disabled=false;next.focus();pb.set(idx+1,qs.length);
      }else{
        missed=true;beep("bad");redo(b,"shake");b.classList.add("wrong","locked","dim");
        redo(drop,"shake");
        msg.className="msg bad";msg.textContent="Ainda não. Tente outra resposta!";
      }
    };
    const opts=h("div",{class:"opts"},order.map((oi,k)=>{
      const b=blk(q.opts[oi],col([2,1,8][k%3]));
      draggable(b,{onTap:()=>answer(oi,b),onDrop:()=>answer(oi,b)});
      return b;
    }));
    dropZone(drop,()=>{});
    next.onclick=()=>{if(idx<qs.length-1){idx++;show()}else finish(id,title,{score,total:qs.length})};
    const body=h("div",{class:"quizwrap"+(q.poem?"":" nopoem")});
    if(q.poem) body.append(poemCard(q.poem));
    body.append(h("div",{},drop,opts));
    app.replaceChildren(
      pb.el,
      h("h2",{class:"q"},q.q),
      body,msg,
      h("div",{class:"bar"},h("span",{class:"count"},`${idx+1} de ${qs.length}`),next)
    );
  }
  show();
}

/* ============ classificar (mundos 2 e 3) ============ */
function playSort(cfg){
  startTimer();
  const all=[];cfg.groups.forEach((g,gi)=>g.items.forEach(t=>all.push({t,gi})));
  const items=shuffle(all).map((x,i)=>({...x,c:col(i)}));
  const placedIn={};   // item -> grupo
  const missed=new Set();
  let sel=null,showHint=false,right=0;
  const pool=h("div",{class:"pool"});
  const boxes=[];
  const msg=h("div",{class:"msg"});
  const pb=progressBar();
  const hintBox=h("div",{});
  const fin=h("button",{class:"btn go",style:{display:"none"}},"Terminar mundo");

  const groupsEl=h("div",{class:"groups"},cfg.groups.map((g,gi)=>{
    const box=h("div",{class:"gslots","data-g":gi,"aria-label":`Caixa ${g.name}`});
    dropZone(box,()=>{if(sel!=null)attempt(sel,gi)});
    boxes[gi]=box;
    return h("div",{class:"group"},h("h3",{},g.name,g.sub?h("small",{},g.sub):null),box);
  }));
  function paintReady(){boxes.forEach(b=>b.classList.toggle("ready",sel!=null))}
  function renderPool(){
    pool.replaceChildren();
    items.forEach((it,i)=>{
      if(placedIn[i]!=null)return;
      const b=blk(it.t,it.c);
      if(sel===i)b.classList.add("sel");
      draggable(b,{
        onStart:()=>{sel=null;paintReady()},
        onTap:()=>{sel=sel===i?null:i;beep("tap");renderPool();paintReady()},
        onDrop:z=>attempt(i,+z.dataset.g)
      });
      pool.append(b);
    });
    if(!pool.children.length) pool.append(h("span",{style:{gridColumn:"1/-1",textAlign:"center",color:"var(--ok)",padding:"20px",fontSize:"1.3rem"}},"Tudo no lugar certo! 🎉"));
  }
  function attempt(i,gi){
    sel=null;
    const it=items[i],box=boxes[gi];
    if(it.gi===gi){
      placedIn[i]=gi;if(!missed.has(i))right++;
      const b=blk(it.t,it.c,{tabindex:"-1"});b.classList.add("locked","pop");
      box.append(b);
      winStar(b);
      msg.className="msg ok";msg.textContent=`Isso! É ${cfg.groups[gi].name.toLowerCase()}.`;
      const n=Object.keys(placedIn).length;pb.set(n,items.length);
      if(n===items.length){beep("win");bigConfetti();fin.style.display=""}
    }else{
      missed.add(i);beep("bad");redo(box,"shake");
      msg.className="msg bad";msg.textContent=`Não é ${cfg.groups[gi].name.toLowerCase()}. Tente outra caixa!`;
    }
    renderPool();paintReady();
  }
  const extra=[];
  if(cfg.explain){
    const hb=h("button",{class:"btn"},"Ver explicação");
    hb.onclick=()=>{showHint=!showHint;hb.textContent=showHint?"Esconder explicação":"Ver explicação";hintBox.replaceChildren(showHint?explainCards():"")};
    extra.push(hb);
  }
  fin.onclick=()=>finish(cfg.id,cfg.title,{score:right,total:items.length});
  app.replaceChildren(
    h("h2",{class:"q small"},cfg.instr),
    h("p",{class:"tip"},"Você também pode tocar na frase e depois na caixa"),
    pb.el,
    h("div",{class:"sortwrap"+(cfg.stack?" stack":"")},h("div",{},pool),groupsEl),
    msg,h("div",{class:"bar"},extra,fin),hintBox
  );
  renderPool();
}

/* ============ final ============ */
function finish(id,title,res){
  stopTimer();
  done[id]=true;store.set("done",done);
  beep("win");bigConfetti();setTimeout(bigConfetti,700);
  const r=res.score/res.total;
  const st=r>=.9?3:r>=.6?2:1;
  const w=WORLDS.find(x=>x.id===id);
  app.replaceChildren(h("div",{class:"end"},
    h("p",{class:"stars","aria-label":`${st} de 3 estrelas`},[0,1,2].map(k=>{
      const s=h("span",{},k<st?"★":"☆");s.style.animationDelay=(k*.25)+"s";return s})),
    h("p",{class:"big"},title),
    h("p",{class:"lead",style:{fontSize:"1.6rem",marginTop:"10px"}},`Você acertou ${res.score} de ${res.total} de primeira.`),
    h("p",{class:"lead"},st<3?"Jogue de novo para ganhar 3 estrelas!":"Você mandou muito bem!"),
    h("div",{class:"bar"},
      h("button",{class:"btn",onclick:()=>w.run()},"Jogar de novo"),
      h("button",{class:"btn go",onclick:showMap},"Voltar ao mapa"))
  ));
}

showMap();
</script>
